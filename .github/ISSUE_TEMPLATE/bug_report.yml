name: Bug report
description: Report a bug found while using kairos skills (dogfood)
labels:
  - bug
  - kairos
body:
  - type: markdown
    attributes:
      value: |
        Use this template to report bugs found during dogfood use of kairos skills.
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which component does this finding relate to?
      options:
        - kairos (general)
        - cdd-engine
        - kairos:cdd-design
        - kairos:cdd-spec-writer
        - kairos:cdd-plan
        - kairos:cdd-dev
        - kairos:cdd-report
        - kairos:cdd-close
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: "Dogfood session context: date, harness, which kairos skills were in use"
      placeholder: "Date: YYYY-MM-DD, Harness: claude-code, Skills: cdd-dev, cdd-plan"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened? Include exact error messages or tool output where available.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: What did this block or degrade — token cost, extra rounds, incorrect state?
    validations:
      required: true
  - type: textarea
    id: suggested-fix
    attributes:
      label: Suggested fix
      description: Concrete suggestion, or leave as "Under investigation"
      placeholder: Under investigation
    validations:
      required: false
  - type: textarea
    id: related
    attributes:
      label: Related
      description: Links to related issues or commits, if known
    validations:
      required: false
