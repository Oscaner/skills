name: Bug report
description: Report a bug found while using spor skills (dogfood)
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template to report bugs found during dogfood use of spor skills.
        Additional labels (`dogfood`, `superpowers-overrides`, and `cdd` for CDD-related findings) will be appended automatically when the issue is filed via the os-report-issue skill.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: "Dogfood session context: branch, date, which spor skills were in use"
      placeholder: "Branch: feat/my-feature, Date: YYYY-MM-DD, Skills: cli-driven-development, os-writing-plans"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened? Include exact error messages or tool output where available.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: "What did this block or degrade — token cost, extra rounds, incorrect state?"
    validations:
      required: true
  - type: textarea
    id: suggested-fix
    attributes:
      label: Suggested fix
      description: Concrete suggestion, or leave as "Under investigation"
      placeholder: Under investigation
    validations:
      required: false
  - type: textarea
    id: related
    attributes:
      label: Related
      description: Links to related issues or commits, if known
    validations:
      required: false
