name: Bug report
description: Report a bug found while using osuperpowers skills (dogfood)
labels: ["bug", "osuperpowers"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template to report bugs found during dogfood use of osuperpowers skills.
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which component does this finding relate to?
      options:
        - osuperpowers (general)
        - cdd-engine
        - osuperpowers:init
        - osuperpowers:brainstorming
        - osuperpowers:writing-plans
        - osuperpowers:cli-driven-development
        - osuperpowers:report-issue
        - osuperpowers:finishing
    validations:
      required: true
  - type: dropdown
    id: session-type
    attributes:
      label: Session type
      description: Was this finding surfaced during a dogfood (CDD session) or a standalone run?
      options:
        - dogfood (CDD session)
        - standalone
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: "Dogfood session context: date, harness, which osuperpowers skills were in use"
      placeholder: "Date: YYYY-MM-DD, Harness: claude-code, Skills: cli-driven-development, writing-plans"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened? Include exact error messages or tool output where available.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: "What did this block or degrade — token cost, extra rounds, incorrect state?"
    validations:
      required: true
  - type: textarea
    id: suggested-fix
    attributes:
      label: Suggested fix
      description: Concrete suggestion, or leave as "Under investigation"
      placeholder: Under investigation
    validations:
      required: false
  - type: textarea
    id: related
    attributes:
      label: Related
      description: Links to related issues or commits, if known
    validations:
      required: false
