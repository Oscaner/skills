name: Enhancement
description: Suggest an improvement to osuperpowers skills or workflow
labels:
  - enhancement
  - osuperpowers
body:
  - type: markdown
    attributes:
      value: |
        Use this template to suggest improvements found during dogfood use of osuperpowers skills.
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which component does this finding relate to?
      options:
        - osuperpowers (general)
        - cdd-engine
        - osuperpowers:brainstorming
        - osuperpowers:writing-single-spec
        - osuperpowers:writing-overall-spec
        - osuperpowers:writing-phase-spec
        - osuperpowers:writing-plans
        - osuperpowers:cli-driven-development
        - osuperpowers:report-issues
        - osuperpowers:finishing
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: "Dogfood session context: date, harness, which osuperpowers skills were in use"
      placeholder: "Date: YYYY-MM-DD, Harness: claude-code, Skills: cli-driven-development"
    validations:
      required: true
  - type: textarea
    id: current-behavior
    attributes:
      label: Current behavior
      description: What happens today?
    validations:
      required: true
  - type: textarea
    id: desired-behavior
    attributes:
      label: Desired behavior
      description: What should happen instead?
    validations:
      required: true
  - type: textarea
    id: suggested-approach
    attributes:
      label: Suggested approach
      description: Concrete suggestion, or "Open for discussion"
      placeholder: Open for discussion
    validations:
      required: false
  - type: textarea
    id: related
    attributes:
      label: Related
      description: Links to related issues or commits, if known
    validations:
      required: false
