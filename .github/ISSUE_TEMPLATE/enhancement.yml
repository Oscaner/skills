name: Enhancement
description: Suggest an improvement to kairos skills or workflow
labels:
  - enhancement
  - kairos
body:
  - type: markdown
    attributes:
      value: |
        Use this template to suggest improvements found during dogfood use of kairos skills.
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which component does this finding relate to?
      options:
        - kairos (general)
        - cdd-engine
        - kairos:cdd-design
        - kairos:cdd-spec
        - kairos:cdd-charter
        - kairos:cdd-phase
        - kairos:cdd-plan
        - kairos:cdd-dev
        - kairos:cdd-report
        - kairos:cdd-close
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: "Dogfood session context: date, harness, which kairos skills were in use"
      placeholder: "Date: YYYY-MM-DD, Harness: claude-code, Skills: cdd-dev"
    validations:
      required: true
  - type: textarea
    id: current-behavior
    attributes:
      label: Current behavior
      description: What happens today?
    validations:
      required: true
  - type: textarea
    id: desired-behavior
    attributes:
      label: Desired behavior
      description: What should happen instead?
    validations:
      required: true
  - type: textarea
    id: suggested-approach
    attributes:
      label: Suggested approach
      description: Concrete suggestion, or "Open for discussion"
      placeholder: Open for discussion
    validations:
      required: false
  - type: textarea
    id: related
    attributes:
      label: Related
      description: Links to related issues or commits, if known
    validations:
      required: false
