name: Validate
description: Install dependencies with a frozen lockfile and run one native validation command (the per-suite CI validation step — each job's command is the suite's own `package.json`/root script, failure-attributable to the job in its own action log).

inputs:
  command:
    description: The native validation command to execute (e.g. `pnpm -C packages/cdd-engine test`).
    required: true
  install-pi:
    description: Install the pi coding agent (the kairos suite's hard-fail install smoke).
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      run: |
        pnpm install --frozen-lockfile
    # @latest is deliberately unpinned: the pi-package contract must stay valid against the
    # moving pi ecosystem — pinning an old version would let this guard decay as pi evolves.
    # The @latest install is still failure-guarded: the C4 install smoke
    # (packages/kairos/tests/pi-install-smoke.test.ts) fails hard with its install
    # command in the message when the binary is missing (zero silent skip).
    - name: Install pi coding agent
      if: inputs.install-pi == 'true'
      shell: bash
      run: |
        npm i -g @earendil-works/pi-coding-agent@latest
    - name: Run ${{ inputs.command }}
      shell: bash
      run: |
        ${{ inputs.command }}
