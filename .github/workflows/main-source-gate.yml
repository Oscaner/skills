name: Main Source Gate

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

jobs:
  enforce:
    name: Main PRs must come from develop
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # develop: integration release PRs
          # changeset-release/*: Version PRs opened by changesets/action on main
          case "$HEAD_REF" in
            develop)
              echo "OK: PR comes from develop."
              ;;
            changeset-release/*)
              echo "OK: changesets Version PR ($HEAD_REF)."
              ;;
            *)
              echo "::error::PRs to main must come from 'develop' or 'changeset-release/*' (got '$HEAD_REF'). Merge into develop first."
              exit 1
              ;;
          esac
