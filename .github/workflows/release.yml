# Release flow (main only):
#   develop accumulates .changeset/*.md → develop→main PR → push main
#   → changesets/action opens Version PR (target main); hasChangesets=true → tag/Release/sync skipped
#   → merge Version PR → push main again; hasChangesets=false → publish mode
#   → per-plugin matrix job (kairos + cdd-engine) pushes a git tag + GitHub Release only for
#     plugins whose current package.json version is newer than their latest git tag (git-tag vs
#     package.json semver judgment: `git tag --list "<tag_prefix>*" | sort -V | tail -1`, then
#     strict x.y.z compare; an empty tag list = first release → versioned). The judgment is derived
#     from the tree itself (native `changeset version` owns the version math), so plugins that were
#     not versioned by the push get no tag/Release — no phantom baseline tag/release → sync PR.
#   First-party kairos + cdd-engine only (vendors self-maintenance surface withdrawn, P6 Task 2 / B2): release-plugin
#   and sync-develop no longer block on vendored co-publish.
#   Push coverage model: `pnpm run validate` covers the PR surface in full (develop→main and
#   changeset-release/* PRs run pr-validate); push→main itself runs no validate — the release
#   surface = emit freshness (Version PR generation runs `pnpm exec changeset version` then
#   `pnpm run emit`) + the pre-version smoke gate (`pnpm -C packages/cdd-engine run smoke` — the
#   engine smoke integration test over a fixture repo, wired before the changesets action, so the
#   released artifact is the verified artifact). The consumer gate's version-expectation flag
#   was withdrawn (P5 user adjudication 2026-10-12): the smoke carries no version assertion.
name: Release (main)

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.has-changesets }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm run emit
      # Pre-version smoke gate (P5 T7): before any publish-side action, run the engine's
      # smoke integration test over a fixture repo (the source bin's dry-run chain).
      # Version-agnostic — passes on both the 0.1.0 version push and the 1.0.0 publish push; a
      # failure here aborts before the action, leaving a clean tree to roll back from.
      - run: pnpm -C packages/cdd-engine run smoke
      - uses: changesets/action@v2
        id: changesets
        with:
          version-script: pnpm run ci:version
          publish-script: pnpm exec changeset publish
          create-github-releases: false
          commit-message: "chore: release plugins"
          pr-title: "chore: release plugins"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  release-plugin:
    needs: release
    if: needs.release.outputs.hasChangesets == 'false'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: kairos
            tag_prefix: "kairos@"
          - name: cdd-engine
            tag_prefix: "cdd-engine@"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Read plugin version
        id: ver
        run: echo "version=$(node -p "require('./packages/${{ matrix.name }}/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Check plugin was versioned in this release (git-tag vs package.json semver)
        id: versioned
        run: |
          # Judgment: versioned iff (a) no git tag exists yet for this package — first release
          # (e.g. cdd-engine@1.0.0 has no "minimum tag" to compare against; the current version IS
          # the first version) — or (b) the current package.json version strictly exceeds the
          # latest git tag. Comparing against the latest tag prevents a phantom tag/Release when
          # the version is unchanged (a ghost tag, or a push that did not version this package).
          latest_tag=$(git tag --list "${{ matrix.tag_prefix }}*" | sort -V | tail -1)
          if [ -z "$latest_tag" ]; then
            echo "versioned=true" >> "$GITHUB_OUTPUT"
          else
            version="${{ steps.ver.outputs.version }}"
            tag="${latest_tag#${{ matrix.tag_prefix }}}"
            # Pure-shell strict X.Y.Z compare — this job runs on a bare checkout (no pnpm
            # install), so it cannot require('semver'); numeric field sort is identical on GNU
            # and BSD, keeping the local rehearsal faithful to the runner.
            if [ "$version" != "$tag" ] && [ "$(printf '%s\n%s\n' "$tag" "$version" | sort -t. -k1,1n -k2,2n -k3,3n | head -1)" = "$tag" ]; then
              echo "versioned=true" >> "$GITHUB_OUTPUT"
            else
              echo "versioned=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Check tag already exists
        id: tag-exists
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ matrix.tag_prefix }}${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create local tag
        if: steps.versioned.outputs.versioned == 'true' && steps.tag-exists.outputs.exists != 'true'
        run: git tag "${{ matrix.tag_prefix }}${{ steps.ver.outputs.version }}"
      - name: Push git tag
        if: steps.versioned.outputs.versioned == 'true' && steps.tag-exists.outputs.exists != 'true'
        run: git push origin "${{ matrix.tag_prefix }}${{ steps.ver.outputs.version }}"
      - name: Check if GitHub Release exists
        id: release-exists
        if: steps.versioned.outputs.versioned == 'true' && steps.tag-exists.outputs.exists != 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const tag = `${{ matrix.tag_prefix }}${{ steps.ver.outputs.version }}`;
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
              core.setOutput('exists', 'true');
            } catch (e) {
              if (e.status !== 404) throw e;
              core.setOutput('exists', 'false');
            }
      - name: Create GitHub Release if missing
        if: steps.versioned.outputs.versioned == 'true' && steps.tag-exists.outputs.exists != 'true' && steps.release-exists.outputs.exists != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ matrix.tag_prefix }}${{ steps.ver.outputs.version }}
          generate_release_notes: true

  sync-develop:
    needs: release
    if: needs.release.outputs.hasChangesets == 'false'
    uses: ./.github/workflows/sync-main-to-develop.yml
    secrets: inherit
