# Release flow (main only):
#   develop accumulates .changeset/*.md → develop→main PR → push main
#   → changesets/action opens Version PR (target main)
#   → merge Version PR → publish + tag + GitHub Release
#   → sync PR main→develop when main is ahead of develop (always checked post-release)
name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run emit
      - uses: changesets/action@v1
        id: changesets
        with:
          version: node scripts/version-packages.mjs
          publish: pnpm exec changeset tag
          commit: "chore: release superpowers-overrides"
          title: "chore: release superpowers-overrides"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve HEAD SHA for tagging
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Read overrides version
        id: overrides-ver
        run: echo "version=$(node -p "require('./plugins/superpowers-overrides/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Create git tag if missing
        uses: actions/github-script@v9
        with:
          script: |
            const tag = `superpowers-overrides@${{ steps.overrides-ver.outputs.version }}`;
            try {
              await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` });
              core.info(`${tag} already exists`);
            } catch (e) {
              if (e.status !== 404) throw e;
              await github.rest.git.createRef({
                ...context.repo,
                ref: `refs/tags/${tag}`,
                sha: '${{ steps.head.outputs.sha }}',
              });
              core.info(`Created ${tag}`);
            }
      - name: Check if GitHub Release exists
        id: release-exists
        uses: actions/github-script@v9
        with:
          script: |
            const tag = `superpowers-overrides@${{ steps.overrides-ver.outputs.version }}`;
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
              core.setOutput('exists', 'true');
              core.info(`Release ${tag} already exists`);
            } catch (e) {
              if (e.status !== 404) throw e;
              core.setOutput('exists', 'false');
            }
      - name: Create GitHub Release if missing
        id: gh-release
        if: steps.release-exists.outputs.exists != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: superpowers-overrides@${{ steps.overrides-ver.outputs.version }}
          generate_release_notes: true
      - name: Check if develop is behind main
        id: needs-sync
        run: |
          git fetch origin main develop
          ahead=$(git rev-list --count origin/develop..origin/main)
          echo "ahead=$ahead" >> "$GITHUB_OUTPUT"
          echo "needs_sync=$([ "$ahead" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "main is $ahead commit(s) ahead of develop"
      - name: Prepare and push sync branch
        if: steps.needs-sync.outputs.needs_sync == 'true'
        run: |
          git fetch origin main develop
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B chore/sync-main-to-develop origin/develop
          git merge origin/main -m "chore: sync main release back to develop"
          git push origin chore/sync-main-to-develop --force-with-lease
      - name: Open sync PR main → develop
        if: steps.needs-sync.outputs.needs_sync == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          base: develop
          branch: chore/sync-main-to-develop
          title: "chore: sync main release back to develop"
          commit-message: "chore: sync main release back to develop"
          body: |
            Automated back-merge after release on `main`.
            Merge to keep `develop` aligned with the released version.
