# Release flow (main only):
#   develop accumulates .changeset/*.md → develop→main PR → push main
#   → changesets/action opens Version PR (target main); hasChangesets=true → tag/Release/sync skipped
#   → merge Version PR → push main again; hasChangesets=false → publish mode
#   → per-plugin matrix job (osuperpowers + cdd-engine) pushes a git tag + GitHub Release only for
#     plugins whose current package.json version is newer than their latest git tag (git-tag vs
#     package.json semver judgment: `git tag --list "<tag_prefix>*" | sort -V | tail -1`, then
#     strict x.y.z compare; an empty tag list = first release → versioned). The judgment is derived
#     from the tree itself (native `changeset version` owns the version math), so plugins that were
#     not versioned by the push get no tag/Release — no phantom baseline tag/release → sync PR.
#   First-party osuperpowers + cdd-engine only (vendors self-maintenance surface withdrawn, P6 Task 2 / B2): release-plugin
#   and sync-develop no longer block on vendored co-publish.
#   Push coverage model: `pnpm run validate` covers the PR surface in full (develop→main and
#   changeset-release/* PRs run pr-validate); push→main itself runs no validate — the release
#   surface = emit freshness (Version PR generation runs `pnpm exec changeset version` then
#   `pnpm run emit`) + the dual consumer gates (pre-version baseline smoke-cdd, and the
#   post-version `changeset status` push-mode split + `smoke-cdd --expect-version 1.0.0` on
#   publish pushes — both wired before the changesets action, so the released artifact is the
#   verified artifact and the post gate intercepts before `changeset publish`). After the
#   publish, a third consumer gate — the post-publish pi registry smoke — installs the released
#   osuperpowers from the npm registry into a throwaway project (`pi install
#   npm:@oscaner-skills/osuperpowers@<published> --local --approve`) and asserts exit 0, the
#   installed skills/ SKILL.md count (the shared EXPECTED truth), and the .pi/settings.json
#   record; a publish push that released only cdd-engine has no osuperpowers entry and skips
#   the smoke — zero install, zero assertion, zero error.
name: Release (main)

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.has-changesets }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm run emit
      # Pre-version consumer-sim gate (P3 T7 / design §2.6): before any publish-side action,
      # black-box the current tree's release candidate through a consumer install (pack →
      # npm install → cdd schema get + 5-command dry-run chain). Version-agnostic — passes on
      # both the 0.1.0 version push and the 1.0.0 publish push; a failure here aborts before
      # the action, leaving a clean tree to roll back from.
      - run: node scripts/run.ts smoke-cdd
      # Post-version gate (P4.2 / design §2.2): split the two push modes BEFORE the action —
      # changesets/action's hasChangesets is only known after it runs (a gate placed after it
      # would sit after `changeset publish` too, losing its interception force). `changeset
      # status` reads the push's pending changesets: an EMPTY array = the Version PR was merged
      # → this push IS the publish mode. Only then the expect-version gate runs — on the 1.0.0
      # publish tree the released artifact (packed AND installed) must carry version 1.0.0
      # ("release artifact = verified artifact"), still before the action's publish.
      - name: Detect publish-mode push (zero pending changesets)
        id: changesets-status
        env:
          CHANGESET_STATUS_FILE: ${{ runner.temp }}/changeset-status.json
        run: |
          pnpm exec changeset status --output="$CHANGESET_STATUS_FILE"
          has_changesets=$(node -e 'const s = JSON.parse(require("node:fs").readFileSync(process.env.CHANGESET_STATUS_FILE, "utf8")); process.stdout.write(s.changesets.length > 0 ? "true" : "false")')
          echo "has_changesets=$has_changesets" >> "$GITHUB_OUTPUT"
      - name: Post-version consumer gate (smoke-cdd --expect-version 1.0.0)
        if: steps.changesets-status.outputs.has_changesets == 'false'
        run: node scripts/run.ts smoke-cdd --expect-version 1.0.0
      - uses: changesets/action@v2
        id: changesets
        with:
          version-script: pnpm run ci:version
          publish-script: pnpm exec changeset publish
          create-github-releases: false
          commit-message: "chore: release plugins"
          pr-title: "chore: release plugins"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Pinned to the version measured at smoke acceptance (pi 0.87.1, locale probe) — the
      # C4 install smoke (packages/osuperpowers/tests/pi-install-smoke.test.mjs) fails hard
      # with this install command in its message when the binary is missing (zero silent skip).
      - name: Install pi coding agent
        run: |
          npm i -g @earendil-works/pi-coding-agent@0.87.1
      # C6 release npm-path smoke (R5 station ②): the real consumer path — the changesets action
      # just published the bumped packages to the npm registry, and this step installs the
      # registry artifact into a throwaway project, proving distribution never depends on the
      # repo working tree. Gated by the same publish-mode split as the Detect publish-mode push
      # step (has_changesets == 'false'): a changesets push opens the Version PR and publishes
      # nothing, so its smoke would install a stale version — skipped by the gate. The version
      # being verified is read from the action's published-packages output (v2 kebab-case) by
      # exact package name; a publish push that did not release osuperpowers (e.g. a
      # cdd-engine-only changeset) has no entry and skips the smoke — zero install, zero
      # assertion, zero error.
      - name: Release smoke — pi install osuperpowers from the registry (npm path)
        if: steps.changesets-status.outputs.has_changesets == 'false'
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
        run: |
          version="$(node -e 'const list = JSON.parse(process.env.PUBLISHED_PACKAGES || "[]"); const hit = (list ?? []).find((p) => p.name === "@oscaner-skills/osuperpowers"); process.stdout.write(hit ? hit.version : "")')"
          if [ -z "$version" ]; then
            echo "::notice::osuperpowers was not published on this push (no entry in changesets published-packages) — skipping the pi registry smoke (zero install, zero assertion, zero error)"
            exit 0
          fi

          # The shared count truth: scripts/validate/osuperpowers.ts exports the module-level
          # EXPECTED — the same single source the in-tree guards and the C4 smoke assert against
          # (never a workflow-local literal; a skills-inventory change flows here automatically).
          # Resolved at repo root, which is this run step's working directory.
          expected="$(node --input-type=module --eval "import('./scripts/validate/osuperpowers.ts').then((m) => process.stdout.write(String(m.EXPECTED)))")"
          [ -n "$expected" ]

          # Throwaway consumer project — the install target is the just-published registry
          # artifact, not the repo tree. --local --approve: the trust-gate pin measured at pi
          # 0.87.1 (--local writes the project .pi/settings.json and requires --approve).
          project="$(mktemp -d)"
          cd "$project"

          # Assertion 1 — the install exits 0 (a nonzero aborts the step via the run-shell -e
          # contract).
          pi install "npm:@oscaner-skills/osuperpowers@${version}" --local --approve

          # Assertion 2 — the installed product's skills/ carries exactly the EXPECTED SKILL.md
          # count. pi resolves npm sources into a project-local .pi/npm node_modules (layout
          # probe-measured at pi 0.87.1: <project>/.pi/npm/node_modules/<pkg>/); each skill is a
          # directory containing SKILL.md, so the count = SKILL.md files at depth 2 under skills/.
          skills_dir="$project/.pi/npm/node_modules/@oscaner-skills/osuperpowers/skills"
          [ -d "$skills_dir" ] || { echo "::error::installed skills/ missing at $skills_dir"; exit 1; }
          count="$(find "$skills_dir" -mindepth 2 -maxdepth 2 -type f -name SKILL.md | wc -l | tr -d " ")"
          echo "Installed osuperpowers SKILL.md count: ${count} (expected ${expected})"
          [ "$count" = "$expected" ] || { echo "::error::installed skills/ SKILL.md count ${count} != expected ${expected}"; exit 1; }

          # Assertion 3 — the project .pi/settings.json records the installed package source.
          node -e 'const fs = require("node:fs"); const s = JSON.parse(fs.readFileSync(".pi/settings.json", "utf8")); const packages = s.packages ?? []; if (!packages.some((p) => typeof p === "string" && p.includes("@oscaner-skills/osuperpowers"))) { console.error("::error::.pi/settings.json packages must record the osuperpowers source, got: " + JSON.stringify(packages)); process.exit(1); }'

          echo "::notice::pi registry smoke OK — osuperpowers@${version} installed and verified from the npm registry"

  release-plugin:
    needs: release
    if: needs.release.outputs.hasChangesets == 'false'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: osuperpowers
            tag_prefix: "osuperpowers@"
          - name: cdd-engine
            tag_prefix: "cdd-engine@"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Read plugin version
        id: ver
        run: echo "version=$(node -p "require('./packages/${{ matrix.name }}/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Check plugin was versioned in this release (git-tag vs package.json semver)
        id: versioned
        run: |
          # Judgment: versioned iff (a) no git tag exists yet for this package — first release
          # (e.g. cdd-engine@1.0.0 has no "minimum tag" to compare against; the current version IS
          # the first version) — or (b) the current package.json version strictly exceeds the
          # latest git tag. Comparing against the latest tag prevents a phantom tag/Release when
          # the version is unchanged (a ghost tag, or a push that did not version this package).
          latest_tag=$(git tag --list "${{ matrix.tag_prefix }}*" | sort -V | tail -1)
          if [ -z "$latest_tag" ]; then
            echo "versioned=true" >> "$GITHUB_OUTPUT"
          else
            version="${{ steps.ver.outputs.version }}"
            tag="${latest_tag#${{ matrix.tag_prefix }}}"
            # Pure-shell strict X.Y.Z compare — this job runs on a bare checkout (no pnpm
            # install), so it cannot require('semver'); numeric field sort is identical on GNU
            # and BSD, keeping the local rehearsal faithful to the runner.
            if [ "$version" != "$tag" ] && [ "$(printf '%s\n%s\n' "$tag" "$version" | sort -t. -k1,1n -k2,2n -k3,3n | head -1)" = "$tag" ]; then
              echo "versioned=true" >> "$GITHUB_OUTPUT"
            else
              echo "versioned=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Check tag already exists
        id: tag-exists
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ matrix.tag_prefix }}${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create local tag
        if: steps.versioned.outputs.versioned == 'true' && steps.tag-exists.outputs.exists != 'true'
        run: git tag "${{ matrix.tag_prefix }}${{ steps.ver.outputs.version }}"
      - name: Push git tag
        if: steps.versioned.outputs.versioned == 'true' && steps.tag-exists.outputs.exists != 'true'
        run: git push origin "${{ matrix.tag_prefix }}${{ steps.ver.outputs.version }}"
      - name: Check if GitHub Release exists
        id: release-exists
        if: steps.versioned.outputs.versioned == 'true' && steps.tag-exists.outputs.exists != 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const tag = `${{ matrix.tag_prefix }}${{ steps.ver.outputs.version }}`;
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
              core.setOutput('exists', 'true');
            } catch (e) {
              if (e.status !== 404) throw e;
              core.setOutput('exists', 'false');
            }
      - name: Create GitHub Release if missing
        if: steps.versioned.outputs.versioned == 'true' && steps.tag-exists.outputs.exists != 'true' && steps.release-exists.outputs.exists != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ matrix.tag_prefix }}${{ steps.ver.outputs.version }}
          generate_release_notes: true

  sync-develop:
    needs: release
    if: needs.release.outputs.hasChangesets == 'false'
    uses: ./.github/workflows/sync-main-to-develop.yml
    secrets: inherit
