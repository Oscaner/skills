name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run emit
      - uses: changesets/action@v1
        with:
          version: node scripts/version-packages.mjs
          publish: pnpm exec changeset tag
          commit: "chore: release superpowers-overrides"
          title: "chore: release superpowers-overrides"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch tags for tag-if-missing
        run: git fetch --tags origin
      - name: Tag and release untagged overrides version
        run: node scripts/tag-if-missing.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
