# Release flow (main only):
#   develop accumulates .changeset/*.md → develop→main PR → push main
#   → changesets/action opens Version PR (target main); hasChangesets=true → tag/Release/sync skipped
#   → merge Version PR → push main again; hasChangesets=false → publish mode
#   → per-plugin matrix job pushes git tag + GitHub Release only for plugins that
#     were actually versioned (recorded in .changeset/versioned-plugins.json by
#     version-packages.mjs); plugins with no changesets are skipped — no phantom
#     baseline tag/release → sync PR
name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run emit
      - uses: changesets/action@v1
        id: changesets
        with:
          version: node scripts/version-packages.mjs
          publish: pnpm exec changeset publish
          createGithubReleases: false
          commit: "chore: release plugins"
          title: "chore: release plugins"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  release-plugin:
    needs: release
    if: needs.release.outputs.hasChangesets == 'false'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: superpowers-overrides
            tag_prefix: "superpowers-overrides@"
          - name: engineering
            tag_prefix: "engineering@"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Read plugin version
        id: ver
        run: echo "version=$(node -p "require('./packages/${{ matrix.name }}/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Check plugin was versioned in this release
        id: versioned
        run: |
          if [ ! -f .changeset/versioned-plugins.json ]; then
            echo "versioned=false" >> "$GITHUB_OUTPUT"
          elif jq -e --arg p "${{ matrix.name }}" '.[] | select(. == $p)' .changeset/versioned-plugins.json >/dev/null 2>&1; then
            echo "versioned=true" >> "$GITHUB_OUTPUT"
          else
            echo "versioned=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check tag already exists
        id: tag-exists
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ matrix.tag_prefix }}${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create local tag
        if: steps.versioned.outputs.versioned == 'true' && steps.tag-exists.outputs.exists != 'true'
        run: git tag "${{ matrix.tag_prefix }}${{ steps.ver.outputs.version }}"
      - name: Push git tag
        if: steps.versioned.outputs.versioned == 'true' && steps.tag-exists.outputs.exists != 'true'
        run: git push origin "${{ matrix.tag_prefix }}${{ steps.ver.outputs.version }}"
      - name: Check if GitHub Release exists
        id: release-exists
        if: steps.versioned.outputs.versioned == 'true' && steps.tag-exists.outputs.exists != 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const tag = `${{ matrix.tag_prefix }}${{ steps.ver.outputs.version }}`;
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
              core.setOutput('exists', 'true');
            } catch (e) {
              if (e.status !== 404) throw e;
              core.setOutput('exists', 'false');
            }
      - name: Create GitHub Release if missing
        if: steps.versioned.outputs.versioned == 'true' && steps.tag-exists.outputs.exists != 'true' && steps.release-exists.outputs.exists != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ matrix.tag_prefix }}${{ steps.ver.outputs.version }}
          generate_release_notes: true

  sync-develop:
    needs: release
    if: needs.release.outputs.hasChangesets == 'false'
    uses: ./.github/workflows/sync-main-to-develop.yml
    secrets: inherit
