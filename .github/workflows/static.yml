# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # The upload runs in its OWN job, never in the deploy job's step list.
  # `actions/deploy-pages` lists the run's artifacts to find `github-pages`, and
  # that listing is eventually consistent: an artifact finalized a fraction of a
  # second earlier can still be missing from it (actions/deploy-pages#451 —
  # measured lag 0.4 s to 46 s). Uploading and deploying in one job (the shape
  # GitHub's own static starter ships) hit the race on this repository twice.
  # A separate job puts the deploy seconds later, which is the shape the other
  # Pages starters use and the one that issue reports as the fix.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the diagrams directory as the site root
          path: 'docs/diagrams'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
