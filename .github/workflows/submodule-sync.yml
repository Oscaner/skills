name: Submodule Sync

on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  bump:
    strategy:
      fail-fast: false
      matrix:
        submodule: [mattpocock-skills, superpowers, impeccable]
    uses: ./.github/workflows/submodule-bump.yml
    with:
      submodule: ${{ matrix.submodule }}
    secrets: inherit
