<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>oscaner-skills — diagrams</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0b0e14;
        --panel: #121722;
        --line: #263040;
        --text: #e6edf7;
        --muted: #8b98ab;
        --accent: #57c7ff;
        --accent-ink: #04121c;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f4f7fb;
          --panel: #ffffff;
          --line: #d7dee9;
          --text: #131a24;
          --muted: #5c6979;
          --accent: #0b6f9f;
          --accent-ink: #ffffff;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px 20px;
        padding: 12px 18px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      .brand {
        display: flex;
        flex-direction: column;
        min-width: 190px;
      }
      .brand strong {
        font-size: 15px;
        letter-spacing: 0.2px;
      }
      .brand span {
        color: var(--muted);
        font-size: 12px;
      }
      nav {
        display: flex;
        gap: 6px;
        margin-left: auto;
      }
      .tabs {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      button,
      .open {
        appearance: none;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--text);
        padding: 7px 14px;
        border-radius: 999px;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
        text-decoration: none;
        white-space: nowrap;
      }
      button:hover,
      .open:hover {
        border-color: var(--accent);
      }
      button[aria-pressed="true"] {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
        font-weight: 600;
      }
      .divider {
        width: 1px;
        align-self: stretch;
        background: var(--line);
      }
      main {
        flex: 1;
        min-height: 0;
        padding: 10px;
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--bg);
      }
      footer {
        display: flex;
        gap: 16px;
        align-items: center;
        padding: 8px 18px 12px;
        color: var(--muted);
        font-size: 12px;
      }
      footer a {
        color: var(--muted);
      }
      @media (max-width: 720px) {
        header {
          align-items: flex-start;
        }
        nav {
          margin-left: 0;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <strong>oscaner-skills</strong>
        <span>CDD marketplace · diagrams</span>
      </div>
      <div class="tabs" role="tablist" aria-label="Diagram">
        <button type="button" role="tab" data-view="architecture" aria-pressed="true">
          Architecture
        </button>
        <button type="button" role="tab" data-view="journey" aria-pressed="false">
          Developer &amp; engine journey
        </button>
        <button type="button" role="tab" data-view="nextloop" aria-pressed="false">
          NEXT-loop
        </button>
      </div>
      <div class="divider" aria-hidden="true"></div>
      <nav aria-label="Language">
        <button type="button" lang="en" data-lang="en" aria-pressed="true">English</button>
        <button type="button" lang="zh-CN" data-lang="zh-CN" aria-pressed="false">中文</button>
      </nav>
    </header>
    <main>
      <iframe
        id="frame"
        src="architecture.en.html"
        title="oscaner-skills architecture diagram"
        loading="eager"
      ></iframe>
    </main>
    <footer>
      <a id="open" href="architecture.en.html" target="_blank" rel="noopener">Open full size ↗</a>
      <span>Switch language above; the diagram content and viewer UI change together.</span>
    </footer>
    <script>
      (() => {
        const views = {
          architecture: {
            en: { file: "architecture.en.html", title: "oscaner-skills — architecture" },
            "zh-CN": { file: "architecture.zh-CN.html", title: "oscaner-skills — 架构" },
          },
          journey: {
            en: { file: "journey.en.html", title: "oscaner-skills — developer & engine journey" },
            "zh-CN": { file: "journey.zh-CN.html", title: "oscaner-skills — 开发者与引擎旅程" },
          },
          nextloop: {
            en: { file: "next-loop.en.html", title: "oscaner-skills — NEXT-loop" },
            "zh-CN": { file: "next-loop.zh-CN.html", title: "oscaner-skills — NEXT 循环" },
          },
        };
        const params = new URLSearchParams(location.search);
        let view = views[params.get("view")] ? params.get("view") : "architecture";
        let lang = views[view][params.get("lang")] ? params.get("lang") : "en";
        const frame = document.getElementById("frame");
        const open = document.getElementById("open");
        const viewButtons = [...document.querySelectorAll("[data-view]")];
        const langButtons = [...document.querySelectorAll("[data-lang]")];

        const render = (push) => {
          const target = views[view][lang];
          frame.src = target.file;
          frame.title = target.title;
          open.href = target.file;
          document.documentElement.lang = lang;
          document.title = target.title;
          for (const button of viewButtons) {
            button.setAttribute("aria-pressed", String(button.dataset.view === view));
          }
          for (const button of langButtons) {
            button.setAttribute("aria-pressed", String(button.dataset.lang === lang));
          }
          const next = `?view=${view}&lang=${lang}`;
          if (push) {
            try {
              history.replaceState(null, "", next);
            } catch {}
          }
          try {
            localStorage.setItem("oscaner-diagrams", next);
          } catch {}
        };

        for (const button of viewButtons) {
          button.addEventListener("click", () => {
            view = button.dataset.view;
            render(true);
          });
        }
        for (const button of langButtons) {
          button.addEventListener("click", () => {
            lang = button.dataset.lang;
            render(true);
          });
        }

        if (!params.get("view") && !params.get("lang")) {
          try {
            const saved = new URLSearchParams(localStorage.getItem("oscaner-diagrams") || "");
            if (views[saved.get("view")]) view = saved.get("view");
            if (views[view][saved.get("lang")]) lang = saved.get("lang");
          } catch {}
        }
        render(false);
      })();
    </script>
  </body>
</html>
